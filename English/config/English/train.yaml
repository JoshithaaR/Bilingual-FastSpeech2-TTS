path:
  ckpt_path: /kaggle/working/English_Output/ckpt
  log_path: /kaggle/working/English_Output/log
  result_path: /kaggle/working/English_Output/result
optimizer:
  batch_size: 8
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-09
  weight_decay: 0.0
  grad_clip_thresh: 1.0
  grad_acc_step: 1
  warm_up_step: 1000
  anneal_steps:
  - 300000
  - 400000
  - 500000
  anneal_rate: 0.3
step:
  total_step: 1000
  log_step: 50
  synth_step: 1000
  val_step: 500
  save_step: 250
  warm_up_step: 250
